<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art preview (dev only)</title>
    <style>
      body { margin: 0; background: #0d0913; color: #efe9f7; font: 14px system-ui; padding: 16px; }
      .grid { display: grid; gap: 24px; }
      .item h2 { font: 600 13px system-ui; margin: 0 0 6px; color: #b9aecb; }
      .wide { aspect-ratio: 16/9; } .square { aspect-ratio: 1; width: min(100%, 700px); }
      .compact .wide { aspect-ratio: 4/3; }
      .frame { border-radius: 14px; overflow: hidden; outline: 1px solid #333; }
      .frame svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module" src="./art-preview.ts"></script>
  </body>
</html>
